mutation UpdateAssessment($input: UpdateAssessmentInput!) {
  updateAssessment(input: $input) {
    ... on Assessment {
      id
      createdAt
      updatedAt
      startDate
      endDate
      mood
      stressLevel
      stressIndex
      bodyTemperature
      oxygenLevel
      oxygenSaturationLevel
      respiratoryRate
      systolicBloodPressure
      diastolicBloodPressure
      heartRate
      heartRateManual
      heartRateManualSource
      heartRateVariability
      sympatheticNervousSystemIndex
      kbType
      kbArtefact
      kbArtefactLevel
      kbCreateTimestamp
      kbMeanHrBpm
      kbMeanRRMs
      kbPnsIndex
      kbReadiness
      kbRmssdMs
      kbSd1Ms
      kbSd2Ms
      kbSdnnMs
      kbSnsIndex
      kbStressIndex
      score
      profileID
      assessmentSelfCareId
      selfCare {
        ... on SelfCare {
          id
          createdAt
          updatedAt
          description
          name
          icon
          index
          numberOfAvailableSlots
          numberOfTotalSlots
          routePath
          selfCareActivityId
          activity {
            ... on Activity {
              id
              createdAt
              updatedAt
              description
              duration
              name
              activityActivityTypeId
              activityType {
                ... on ActivityType {
                  id
                  createdAt
                  updatedAt
                  description
                  identifier
                  name
                }
              }
              reward {
                ... on Reward {
                  id
                  createdAt
                  updatedAt
                  description
                  name
                  rewardCredits
                  maxNumberOfRedemptions
                  rewardType {
                    ... on RewardType {
                      id
                      createdAt
                      updatedAt
                      description
                      identifier
                      name
                    }
                  }
                }
              }
            }
          }
          selfCareSelfCareTypeId
          selfCareType {
            ... on SelfCareType {
              id
              createdAt
              updatedAt
              description
              identifier
              name
            }
          }
          url
        }
      }
      _deleted
      _lastChangedAt
      _version
    }
  }
}
