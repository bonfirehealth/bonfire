mutation CreateQuestionFile($input: CreateQuestionFileInput!) {
  createQuestionFile(input: $input) {
    ... on QuestionFile {
      id
      createdAt
      updatedAt
      isHidden
      key
      name
      url
      userID
      user {
        ... on User {
          id
          username
          photoBase64
        }
      }
      questionID
      question {
        ... on Question {
          id
          description
          name
        }
      }
      _deleted
      _lastChangedAt
      _version
    }
  }
}
