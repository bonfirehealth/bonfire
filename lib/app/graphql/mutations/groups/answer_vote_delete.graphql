mutation DeleteAnswerVote($input: DeleteAnswerVoteInput!) {
  deleteAnswerVote(input: $input) {
    ... on AnswerVote {
      id
      createdAt
      updatedAt
      isHidden
      userID
      user {
        ... on User {
          id
          username
          photoBase64
        }
      }
      answerID
      answer {
        ... on Answer {
          id
          description
          name
        }
      }
      _deleted
      _lastChangedAt
      _version
    }
  }
}
