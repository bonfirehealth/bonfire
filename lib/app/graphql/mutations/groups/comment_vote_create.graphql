mutation CreateCommentVote($input: CreateCommentVoteInput!) {
  createCommentVote(input: $input) {
    ... on CommentVote {
      id
      createdAt
      updatedAt
      isHidden
      userID
      user {
        ... on User {
          id
          username
          photoBase64
        }
      }
      commentID
      comment {
        ... on Comment {
          id
          description
          name
        }
      }
      _deleted
      _lastChangedAt
      _version
    }
  }
}
