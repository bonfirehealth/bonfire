query ListAllSuggestionsByStressLevel(
  $stressLevel: String
  $isHidden: Boolean = false
) {
  listSuggestions(
    filter: {
      stressLevel: {contains: $stressLevel}
      and: {isHidden: {eq: $isHidden}}
    }
  ) {
    items {
      ... on Suggestion {
        id
        createdAt
        updatedAt
        description
        icon
        index
        isHidden
        name
        numberOfClicks
        numberOfViews
        routePath
        url
        uri
        organisationID
        suggestionType {
          ... on SuggestionType {
            id
            description
            name
            identifier
          }
        }
        suggestionActivityId
        activity {
          ... on Activity {
            id
            createdAt
            updatedAt
            description
            name
            activityActivityTypeId
            activityType {
              ... on ActivityType {
                id
                createdAt
                updatedAt
                description
                identifier
                name
              }
            }
            reward {
              ... on Reward {
                id
                createdAt
                updatedAt
                description
                name
                rewardCredits
                maxNumberOfRedemptions
                rewardType {
                  ... on RewardType {
                    id
                    createdAt
                    updatedAt
                    description
                    identifier
                    name
                  }
                }
              }
            }
          }
        }
        selfCare {
          ... on SelfCare {
            id
            createdAt
            updatedAt
            description
            name
            icon
            index
            numberOfAvailableSlots
            numberOfTotalSlots
            routePath
            selfCareActivityId
            activity {
              ... on Activity {
                id
                createdAt
                updatedAt
                description
                duration
                name
                activityActivityTypeId
                activityType {
                  ... on ActivityType {
                    id
                    createdAt
                    updatedAt
                    description
                    identifier
                    name
                  }
                }
                reward {
                  ... on Reward {
                    id
                    createdAt
                    updatedAt
                    description
                    name
                    rewardCredits
                    maxNumberOfRedemptions
                    rewardType {
                      ... on RewardType {
                        id
                        createdAt
                        updatedAt
                        description
                        identifier
                        name
                      }
                    }
                  }
                }
              }
            }
            selfCareSelfCareTypeId
            selfCareType {
              ... on SelfCareType {
                id
                createdAt
                updatedAt
                description
                identifier
                name
              }
            }
            url
          }
        }
        _deleted
        _lastChangedAt
        _version
      }
    }
  }
}
