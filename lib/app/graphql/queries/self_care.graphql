query GetSelfCare($selfCareID: ID!) {
  getSelfCare(id: $selfCareID) {
    ... on SelfCare {
      id
      createdAt
      updatedAt
      description
      name
      icon
      index
      numberOfAvailableSlots
      numberOfTotalSlots
      routePath
      selfCareActivityId
      activity {
        ... on Activity {
          id
          createdAt
          updatedAt
          description
          duration
          name
          activityActivityTypeId
          activityType {
            ... on ActivityType {
              id
              createdAt
              updatedAt
              description
              identifier
              name
            }
          }
          reward {
            ... on Reward {
              id
              createdAt
              updatedAt
              description
              name
              rewardCredits
              maxNumberOfRedemptions
              rewardType {
                ... on RewardType {
                  id
                  createdAt
                  updatedAt
                  description
                  identifier
                  name
                }
              }
            }
          }
        }
      }
      selfCareSelfCareTypeId
      selfCareType {
        ... on SelfCareType {
          id
          createdAt
          updatedAt
          description
          identifier
          name
        }
      }
      url
      profiles {
        items {
          ... on SelfCareUsage {
            id
            profileID
            selfCareID
          }
        }
      }
      _deleted
      _lastChangedAt
      _version
    }
  }
}
