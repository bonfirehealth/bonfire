query ListAllSelfCareUsagesByProfile($profileID: ID, $limit: Int) {
  listSelfCareUsages(filter: {profileID: {eq: $profileID}}, limit: $limit) {
    items {
      ... on SelfCareUsage {
        id
        createdAt
        updatedAt
        profileID
        selfCareID
        owner
        profile {
          ... on Profile {
            id
          }
        }
        selfCare {
          ... on SelfCare {
            id
            createdAt
            updatedAt
            description
            name
            icon
            index
            numberOfAvailableSlots
            numberOfTotalSlots
            routePath
            selfCareActivityId
            activity {
              ... on Activity {
                id
                createdAt
                updatedAt
                description
                duration
                name
                activityActivityTypeId
                activityType {
                  ... on ActivityType {
                    id
                    createdAt
                    updatedAt
                    description
                    identifier
                    name
                  }
                }
                reward {
                  ... on Reward {
                    id
                    createdAt
                    updatedAt
                    description
                    name
                    rewardCredits
                    maxNumberOfRedemptions
                    rewardType {
                      ... on RewardType {
                        id
                        createdAt
                        updatedAt
                        description
                        identifier
                        name
                      }
                    }
                  }
                }
              }
            }
            selfCareSelfCareTypeId
            selfCareType {
              ... on SelfCareType {
                id
                createdAt
                updatedAt
                description
                identifier
                name
              }
            }
            url
          }
        }
        _deleted
        _lastChangedAt
        _version
      }
    }
  }
}
