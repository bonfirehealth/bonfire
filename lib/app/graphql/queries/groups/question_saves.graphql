query ListAllQuestionSaves(
  $userID: ID!
  $isHidden: Boolean = false
  $sortDirection: ModelSortDirection = DESC
) {
  latestQuestionSaves(
    userID: $userID
    filter: {isHidden: {eq: $isHidden}}
    sortDirection: $sortDirection
  ) {
    items {
      ... on QuestionSave {
        id
        createdAt
        updatedAt
        isHidden
        userID
        user {
          ... on User {
            id
            username
            photoBase64
          }
        }
        questionID
        question {
          ... on Question {
            id
            createdAt
            updatedAt
            description
            identifier
            index
            isHidden
            name
            numberOfAnswers
            numberOfClicks
            numberOfSaves
            numberOfVotes
            numberOfViews
            userID
            user {
              ... on User {
                id
                username
              }
            }
            groupID
            group {
              ... on Group {
                id
                description
                name
              }
            }
            answers(sortDirection: DESC) {
              items {
                ... on Answer {
                  id
                  createdAt
                  updatedAt
                  description
                  identifier
                  index
                  isHidden
                  name
                  numberOfClicks
                  numberOfComments
                  numberOfVotes
                  numberOfViews
                  userID
                  user {
                    ... on User {
                      id
                      username
                    }
                  }
                  questionID
                  question {
                    ... on Question {
                      id
                      description
                      name
                    }
                  }
                  comments {
                    items {
                      ... on Comment {
                        id
                        createdAt
                        updatedAt
                        description
                        identifier
                        index
                        isHidden
                        name
                        numberOfClicks
                        numberOfVotes
                        numberOfViews
                        userID
                        answerID
                        files {
                          items {
                            ... on CommentFile {
                              id
                              createdAt
                              updatedAt
                              isHidden
                              name
                              url
                              userID
                              commentID
                              _deleted
                              _lastChangedAt
                              _version
                            }
                          }
                        }
                        votes(
                          filter: {userID: {eq: $userID}, isHidden: {eq: false}}
                        ) {
                          items {
                            ... on CommentVote {
                              id
                              createdAt
                              updatedAt
                              isHidden
                              userID
                              user {
                                ... on User {
                                  id
                                }
                              }
                              commentID
                              comment {
                                ... on Comment {
                                  id
                                }
                              }
                              _deleted
                              _lastChangedAt
                              _version
                            }
                          }
                        }
                        _deleted
                        _lastChangedAt
                        _version
                      }
                    }
                  }
                  files {
                    items {
                      ... on AnswerFile {
                        id
                        createdAt
                        updatedAt
                        isHidden
                        key
                        name
                        url
                        userID
                        answerID
                        _deleted
                        _lastChangedAt
                        _version
                      }
                    }
                  }
                  votes(
                    filter: {userID: {eq: $userID}, isHidden: {eq: false}}
                  ) {
                    items {
                      ... on AnswerVote {
                        id
                        createdAt
                        updatedAt
                        isHidden
                        userID
                        user {
                          ... on User {
                            id
                          }
                        }
                        answerID
                        answer {
                          ... on Answer {
                            id
                          }
                        }
                        _deleted
                        _lastChangedAt
                        _version
                      }
                    }
                  }
                  _deleted
                  _lastChangedAt
                  _version
                }
              }
            }
            files {
              items {
                ... on QuestionFile {
                  id
                  createdAt
                  updatedAt
                  isHidden
                  key
                  name
                  url
                  userID
                  questionID
                  _deleted
                  _lastChangedAt
                  _version
                }
              }
            }
            saves(filter: {userID: {eq: $userID}, isHidden: {eq: false}}) {
              items {
                ... on QuestionSave {
                  id
                  createdAt
                  updatedAt
                  isHidden
                  userID
                  user {
                    ... on User {
                      id
                      username
                    }
                  }
                  questionID
                  question {
                    ... on Question {
                      id
                      description
                      name
                    }
                  }
                  _deleted
                  _lastChangedAt
                  _version
                }
              }
            }
            votes(filter: {userID: {eq: $userID}, isHidden: {eq: false}}) {
              items {
                ... on QuestionVote {
                  id
                  createdAt
                  updatedAt
                  isHidden
                  userID
                  user {
                    ... on User {
                      id
                    }
                  }
                  questionID
                  question {
                    ... on Question {
                      id
                    }
                  }
                  _deleted
                  _lastChangedAt
                  _version
                }
              }
            }
            _deleted
            _lastChangedAt
            _version
          }
        }
        _deleted
        _lastChangedAt
        _version
      }
    }
  }
}
