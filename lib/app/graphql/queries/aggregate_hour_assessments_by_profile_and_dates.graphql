query ListAllAggregateHourAssessmentsByProfileAndDates(
  $profileID: ID!
  $startDate: String
  $endDate: String
  $sortDirection: ModelSortDirection
) {
  aggregateHourAssessmentsByEndDate(
    filter: {startDate: {gt: $startDate}}
    endDate: {lt: $endDate}
    profileID: $profileID
    sortDirection: $sortDirection
  ) {
    items {
      ... on AggregateHourAssessment {
        id
        createdAt
        updatedAt
        startDate
        endDate
        latestMood
        latestStressLevel
        averageOxygenLevel
        averageOxygenSaturationLevel
        averageRespiratoryRate
        averageStressIndex
        averageSystolicBloodPressure
        averageDiastolicBloodPressure
        averageHeartRate
        averageHeartRateVariability
        averageSympatheticNervousSystemIndex
        averageScore
        profileID
        numberOfAssessments
        _deleted
        _lastChangedAt
        _version
      }
    }
  }
}
