query ListUsersByOrganisation(
  $organisationID: ID
  $hourStartDate: String
  $hourEndDate: String
  $hourSortDirection: ModelSortDirection
  $dayStartDate: String
  $dayEndDate: String
  $daySortDirection: ModelSortDirection
  $monthStartDate: String
  $monthEndDate: String
  $monthSortDirection: ModelSortDirection
  $yearStartDate: String
  $yearEndDate: String
  $yearSortDirection: ModelSortDirection
) {
  listOrganisationUsers(
    filter: {organisationID: {eq: $organisationID}}
    limit: 999999999
  ) {
    items {
      ... on OrganisationUser {
        id
        createdAt
        updatedAt
        organisation {
          ... on Organisation {
            id
            name
            totalNumberOfActiveUsers
            totalNumberOfUsers
            totalNumberOfCompletedScreenings
            totalNumberOfIncompletedScreenings
            totalNumberOfSuggestionsClicked
            totalNumberOfSuggestionsViewed
            logoURL
            themeColor
            organisationType {
              ... on OrganisationType {
                id
                description
                name
                identifier
              }
            }
          }
        }
        user {
          ... on User {
            id
            createdAt
            updatedAt
            externalUserID
            emailAddress
            deletedAt
            username
            userType {
              ... on UserType {
                id
                description
                name
                identifier
              }
            }
            photoBase64
            photoURL
            profile {
              ... on Profile {
                id
                createdAt
                updatedAt
                age
                gender
                weight
                weightUnit
                weightUnitName
                height
                heightUnit
                heightUnitName
                bodyMassIndex
                mood
                stressLevel
                stressIndex
                oxygenLevel
                oxygenSaturationLevel
                respiratoryRate
                systolicBloodPressure
                diastolicBloodPressure
                heartRate
                heartRateVariability
                sympatheticNervousSystemIndex
                timezone
                assessments(limit: 999999999) {
                  items {
                    ... on Assessment {
                      id
                      createdAt
                      updatedAt
                      startDate
                      endDate
                      mood
                      stressLevel
                      stressIndex
                      oxygenLevel
                      oxygenSaturationLevel
                      respiratoryRate
                      systolicBloodPressure
                      diastolicBloodPressure
                      heartRate
                      heartRateManual
                      heartRateManualSource
                      heartRateVariability
                      sympatheticNervousSystemIndex
                      score
                      profileID
                      assessmentSelfCareId
                      selfCare {
                        ... on SelfCare {
                          id
                          createdAt
                          updatedAt
                          description
                          name
                          icon
                          index
                          numberOfAvailableSlots
                          numberOfTotalSlots
                          routePath
                          selfCareActivityId
                          activity {
                            ... on Activity {
                              id
                              createdAt
                              updatedAt
                              description
                              duration
                              name
                              activityActivityTypeId
                              activityType {
                                ... on ActivityType {
                                  id
                                  createdAt
                                  updatedAt
                                  description
                                  identifier
                                  name
                                }
                              }
                              reward {
                                ... on Reward {
                                  id
                                  createdAt
                                  updatedAt
                                  description
                                  name
                                  rewardCredits
                                  maxNumberOfRedemptions
                                  rewardType {
                                    ... on RewardType {
                                      id
                                      createdAt
                                      updatedAt
                                      description
                                      identifier
                                      name
                                    }
                                  }
                                }
                              }
                            }
                          }
                          selfCareSelfCareTypeId
                          selfCareType {
                            ... on SelfCareType {
                              id
                              createdAt
                              updatedAt
                              description
                              identifier
                              name
                            }
                          }
                          url
                        }
                      }
                      _version
                      _deleted
                    }
                  }
                }
                aggregateHourAssessments(
                  filter: {startDate: {gt: $hourStartDate}}
                  endDate: {lt: $hourEndDate}
                  sortDirection: $hourSortDirection
                  limit: 999999999
                ) {
                  items {
                    ... on AggregateHourAssessment {
                      id
                      createdAt
                      updatedAt
                      startDate
                      endDate
                      latestMood
                      latestStressLevel
                      averageOxygenLevel
                      averageOxygenSaturationLevel
                      averageRespiratoryRate
                      averageStressIndex
                      averageSystolicBloodPressure
                      averageDiastolicBloodPressure
                      averageHeartRate
                      averageHeartRateVariability
                      averageSympatheticNervousSystemIndex
                      averageScore
                      profileID
                      numberOfAssessments
                      _deleted
                      _lastChangedAt
                      _version
                    }
                  }
                }
                aggregateDayAssessments(
                  filter: {startDate: {gt: $dayStartDate}}
                  endDate: {lt: $dayEndDate}
                  sortDirection: $daySortDirection
                  limit: 999999999
                ) {
                  items {
                    ... on AggregateDayAssessment {
                      id
                      createdAt
                      updatedAt
                      startDate
                      endDate
                      latestMood
                      latestStressLevel
                      averageOxygenLevel
                      averageOxygenSaturationLevel
                      averageRespiratoryRate
                      averageStressIndex
                      averageSystolicBloodPressure
                      averageDiastolicBloodPressure
                      averageHeartRate
                      averageHeartRateVariability
                      averageSympatheticNervousSystemIndex
                      averageScore
                      profileID
                      numberOfAssessments
                      _deleted
                      _lastChangedAt
                      _version
                    }
                  }
                }
                aggregateMonthAssessments(
                  filter: {startDate: {gt: $monthStartDate}}
                  endDate: {lt: $monthEndDate}
                  sortDirection: $monthSortDirection
                  limit: 999999999
                ) {
                  items {
                    ... on AggregateMonthAssessment {
                      id
                      createdAt
                      updatedAt
                      startDate
                      endDate
                      latestMood
                      latestStressLevel
                      averageOxygenLevel
                      averageOxygenSaturationLevel
                      averageRespiratoryRate
                      averageStressIndex
                      averageSystolicBloodPressure
                      averageDiastolicBloodPressure
                      averageHeartRate
                      averageHeartRateVariability
                      averageSympatheticNervousSystemIndex
                      averageScore
                      profileID
                      numberOfAssessments
                      _deleted
                      _lastChangedAt
                      _version
                    }
                  }
                }
                aggregateYearAssessments(
                  filter: {startDate: {gt: $yearStartDate}}
                  endDate: {lt: $yearEndDate}
                  sortDirection: $yearSortDirection
                  limit: 999999999
                ) {
                  items {
                    ... on AggregateYearAssessment {
                      id
                      createdAt
                      updatedAt
                      startDate
                      endDate
                      latestMood
                      latestStressLevel
                      averageOxygenLevel
                      averageOxygenSaturationLevel
                      averageRespiratoryRate
                      averageStressIndex
                      averageSystolicBloodPressure
                      averageDiastolicBloodPressure
                      averageHeartRate
                      averageHeartRateVariability
                      averageSympatheticNervousSystemIndex
                      averageScore
                      profileID
                      numberOfAssessments
                      _deleted
                      _lastChangedAt
                      _version
                    }
                  }
                }
                selfCareUsages {
                  items {
                    ... on SelfCareUsage {
                      id
                    }
                  }
                }
                _version
                _deleted
              }
            }
            organisations {
              items {
                ... on OrganisationUser {
                  id
                  organisation {
                    id
                    name
                    logoURL
                    themeColor
                  }
                }
              }
            }
            _deleted
            _lastChangedAt
            _version
          }
        }
      }
    }
  }
}
