flutter_icons:
  android: ic_launcher
  ios: true
  image_path: images/logo.png
  remove_alpha_ios: true

flutter_native_splash:
  color: "#1A56CF"
  image: images/logo_transparent.png
  color_dark: "#1A56CF"
  image_dark: images/logo_transparent.png
  info_plist_files:
    - "ios/Runner/Info.plist"
    - "ios/Runner/Info-Debug.plist"
    - "ios/Runner/Info-Profile.plist"
    - "ios/Runner/Info-Release.plist"
  android_12:
    image: images/logo_transparent.png
    image_dark: images/logo_transparent.png
    color: "#1A56CF"
    icon_background_color: "#1A56CF"
    icon_background_color_dark: "#1A56CF"
