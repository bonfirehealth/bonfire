          style: italic
        - asset: google_fonts/Metropolis-Light.ttf
          weight: 300
        - asset: google_fonts/Metropolis-LightItalic.ttf
          style: italic
        - asset: google_fonts/Metropolis-Regular.ttf
          weight: 400
        - asset: google_fonts/Metropolis-Italic.ttf
          style: italic
        - asset: google_fonts/Metropolis-Medium.ttf
          weight: 500
        - asset: google_fonts/Metropolis-MediumItalic.ttf
          style: italic
        - asset: google_fonts/Metropolis-SemiBold.ttf
          weight: 600
        - asset: google_fonts/Metropolis-SemiBoldItalic.ttf
          style: italic
        - asset: google_fonts/Metropolis-Bold.ttf
          weight: 700
        - asset: google_fonts/Metropolis-BoldItalic.ttf
          style: italic
        - asset: google_fonts/Metropolis-ExtraBold.ttf
          weight: 800
        - asset: google_fonts/Metropolis-ExtraBoldItalic.ttf
          style: italic
        - asset: google_fonts/Metropolis-Black.ttf
          weight: 900
        - asset: google_fonts/Metropolis-BlackItalic.ttf
          style: italic

    - family: Poppins
      fonts:
        - asset: google_fonts/Poppins-Thin.ttf
          weight: 100
        - asset: google_fonts/Poppins-ThinItalic.ttf
          style: italic
        - asset: google_fonts/Poppins-ExtraLight.ttf
          weight: 200
        - asset: google_fonts/Poppins-ExtraLightItalic.ttf
          style: italic
