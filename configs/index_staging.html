<!DOCTYPE html>
<html lang="en">
  <head>
    <base href="$FLUTTER_BASE_HREF" />

    <meta charset="UTF-8" />
    <meta content="IE=Edge" http-equiv="X-UA-Compatible" />
    <meta name="description" content="Checkup by Bonfire Health" />
    <meta name="robots" content="noindex,nofollow" />

    <!-- iOS meta tags & icons -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Checkup" />
    <link rel="apple-touch-icon" href="icons/Icon-192.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png" />

    <title>Checkup by Bonfire Health Staging</title>
    <link rel="manifest" href="manifest.json" />
    <script src="splash/splash.js"></script>
    <link rel="stylesheet" type="text/css" href="splash/style.css" />
    <script
      src="https://cdn.onesignal.com/sdks/OneSignalSDK.js"
      async=""
    ></script>
    <script src="./assets/packages/mixpanel_flutter/assets/mixpanel.js"></script>
    <script>
      window.OneSignal = window.OneSignal || [];
      OneSignal.push(function () {
        OneSignal.init({
          appId: "0f81b8df-da7f-43fd-acc9-5b21725f5853",
          safari_web_id:
            "web.onesignal.auto.468a09a1-a4c0-43e5-8472-22975b523798",
        });
        checkPushNotificationEnabled();
      });

      function checkPushNotificationEnabled() {
        OneSignal.isPushNotificationsEnabled(function (isEnabled) {
          if (isEnabled) {
            OneSignal.getUserId(function (userId) {
              localStorage.setItem(
                "flutter.web_push_notification_token",
                `"${userId}"`
              );
              let externalUserId = localStorage.getItem("flutter.user_id");
              if (externalUserId !== null) {
                externalUserId = externalUserId.replace(/"/g, "");
                OneSignal.setExternalUserId(externalUserId);
              }
            });
          }
        });
      }
    </script>
  </head>

  <body>
    <picture id="splash">
      <source
        srcset="
          splash/img/light-1x.png 1x,
          splash/img/light-2x.png 2x,
          splash/img/light-3x.png 3x,
          splash/img/light-4x.png 4x
        "
        media="(prefers-color-scheme: light)"
      />
      <source
        srcset="
          splash/img/dark-1x.png 1x,
          splash/img/dark-2x.png 2x,
          splash/img/dark-3x.png 3x,
          splash/img/dark-4x.png 4x
        "
        media="(prefers-color-scheme: dark)"
      />
      <img
        class="center"
        aria-hidden="true"
        src="splash/img/light-1x.png"
        alt=""
      />
    </picture>

    <source
      srcset="
        splash/img/dark-1x.png 1x,
        splash/img/dark-2x.png 2x,
        splash/img/dark-3x.png 3x,
        splash/img/dark-4x.png 4x
      "
      media="(prefers-color-scheme: dark)"
    />
    <img
      class="center"
      aria-hidden="true"
      src="splash/img/light-1x.png"
      alt=""
    />

    <script>
      var serviceWorkerVersion = null;
      var scriptLoaded = false;
      function loadMainDartJs() {
        if (scriptLoaded) {
          return;
        }
        scriptLoaded = true;
        var scriptTag = document.createElement("script");
        scriptTag.src = "main.dart.js";
        scriptTag.type = "application/javascript";
        document.body.append(scriptTag);
      }

      if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
          var serviceWorkerUrl =
            "flutter_service_worker.js?v=" + serviceWorkerVersion;
          navigator.serviceWorker.register(serviceWorkerUrl).then((reg) => {
            function waitForActivation(serviceWorker) {
              serviceWorker.addEventListener("statechange", () => {
                if (serviceWorker.state == "activated") {
                  loadMainDartJs();
                }
              });
            }
            if (!reg.active && (reg.installing || reg.waiting)) {
              waitForActivation(reg.installing || reg.waiting);
            } else if (!reg.active.scriptURL.endsWith(serviceWorkerVersion)) {
              reg.update();
              waitForActivation(reg.installing);
            } else {
              loadMainDartJs();
            }
          });

          setTimeout(() => {
            if (!scriptLoaded) {
              console.warn(
                "Failed to load app from service worker. Falling back to plain <script> tag."
              );
              loadMainDartJs();
            }
          }, 4000);
        });
      } else {
        loadMainDartJs();
      }
    </script>
  </body>
</html>
